{% extends "base.html" %}
{% load ui %}
{% block content %}
<div class="page-head">
  <div>
    <h1>{{ title }}</h1>
    <p class="muted">{% t "reports_sub" %}</p>
  </div>
</div>
<div class="rep-grid">
  {% for r in reports %}
  <a class="card rep-card" href="{% url 'ledger_report' r.key %}">
    <span class="stat-icon">{% icon r.icon 20 %}</span>
    <span><strong>{{ r.label }}</strong><small>{{ r.help }}</small></span>
  </a>
  {% endfor %}
</div>
{% endblock %}
